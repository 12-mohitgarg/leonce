<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8c6d33" />
      <stop offset="50%" stopColor="#e5c17b" />
      <stop offset="100%" stopColor="#c5a059" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0052d4" />
      <stop offset="100%" stopColor="#00e1ff" />
    </linearGradient>
  </defs>
  
  {/* Outer Board outline */}
  <rect x="15" y="15" width="70" height="70" rx="10" fill="#040712" stroke="url(#goldGrad)" strokeWidth="3" />
  
  {/* Inner Core */}
  <rect x="32" y="32" width="36" height="36" rx="6" fill="url(#blueGrad)" opacity="0.9" />
  
  {/* Micro traces */}
  <line x1="50" y1="15" x2="50" y2="32" stroke="url(#goldGrad)" strokeWidth="3" />
  <line x1="50" y1="68" x2="50" y2="85" stroke="url(#goldGrad)" strokeWidth="3" />
  <line x1="15" y1="50" x2="32" y2="50" stroke="url(#goldGrad)" strokeWidth="3" />
  <line x1="68" y1="50" x2="85" y2="50" stroke="url(#goldGrad)" strokeWidth="3" />

  {/* Corner micro pads */}
  <circle cx="25" cy="25" r="4" fill="#00e1ff" />
  <circle cx="75" cy="25" r="4" fill="#00e1ff" />
  <circle cx="25" cy="75" r="4" fill="#00e1ff" />
  <circle cx="75" cy="75" r="4" fill="#00e1ff" />
</svg>